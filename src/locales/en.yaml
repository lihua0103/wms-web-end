  panel:
    agentName: WMS AI Agent
    entryLabel: AI Agent
    statusRemote: Online · Remote Engine
    statusLocal: Online · Local Preview Engine
    statusOff: Offline
    greeting: Hello, I am the WMS AI Agent. I can help you check stock, track documents, find issues, and generate reports, and I also support international logistics scenarios (freight quotes, ETA queries, customs compliance, exception handling) — click a skill card below or type a command directly.
    disabledMsg: The AI Agent feature is disabled. Ask an administrator to enable it in platform-config.json.
    stopped: (Generation stopped)
    clearSession: Clear Session
    collapse: Collapse
    toolCalling: Calling…
    tokenUsage: "{count} tokens used"
    inputPh: "Enter a command, e.g.: Check Class A material stock in WH001"
    skill:
      checkStock:
        title: Check Stock
        prompt: Check the current stock and location occupancy of zones A/B in WH001 Shanghai Main Warehouse
      trackDocs:
        title: Track Documents
        prompt: Which step has inbound appointment ASN202609260013 reached
      findIssues:
        title: Find Issues
        prompt: Scan today's stock warnings and operation exceptions, listed by priority
      genReport:
        title: Generate Reports
        prompt: Generate key points of this week's inbound/outbound and operation efficiency report
      freightQuote:
        title: Freight Quote
        prompt: Estimate ocean freight and transit time for 2 pallets / 500kg from Shanghai to Los Angeles
      etaQuery:
        title: ETA Query
        prompt: Expected delivery time of delivery order DP202609250008, and whether it is delayed
      customsCheck:
        title: Customs Compliance
        prompt: Review whether export document elements are complete and the HS classification is correct
      exceptionHandle:
        title: Exception Handling
        prompt: Handle the WH002 stockout warning and create a handling ticket
    preview:
      engineOff: AI Agent feature is disabled (AiEnabled=false)
      remoteFallback: Remote engine connection failed ({msg}); switched to the local preview engine
      engineError: Preview engine error
      inventory:
        thought: "Command understood: stock query. Params: warehouse=WH001 Shanghai Main Warehouse (default current), scope=A/B storage zones, output=available stock and locations."
        toolSummary: Matched 3 SKUs, 6 batches, 41 locations
        body: |-
          Real-time stock of **WH001 Shanghai Main Warehouse** queried. Key results:

          **1. SKU00003 Precision Bearing (Class A)**
          - Available: 1,284 pcs ｜ Locations B-03-01 to B-03-06
          - Batch expiry: B2609A (expires 2027-03-15) ｜ Safety stock attainment 96%
          - Status: Normal

          **2. SKU00011 Lithium Battery Module (Dangerous Goods)**
          - Available: 460 pcs ｜ Location D-02-03 (quarantine zone, UN3480)
          - ⚠ Below the safety stock line (500 pcs); replenishment review recommended

          **3. SKU00027 Precision Machinery Parts**
          - Available: 2,150 pcs ｜ Location B-05-02
          - ⚠ Slow-moving alert: no outbound records for 90 consecutive days

          Summary: Zone A location occupancy 82%, Zone B 67%. Shall I export details, check a batch's serial numbers, or generate replenishment suggestions?
        s1: Generate replenishment suggestions for SKU00011
        s2: Check Zone B location occupancy details
        s3: Export a stock snapshot
      docTrace:
        thought: "Command understood: full-chain document tracking. Document ASN202609260013 (inbound appointment); retrieving execution progress along the appointment → receiving → QC → putaway chain."
        toolSummary: Chain matched 4 nodes; currently held at QC
        body: |-
          Progress of **ASN202609260013** (Inbound Appointment · Owner A East Electronics):

          - ✅ Appointment confirmed: 09-26 09:12, dock D-03, slot 14:00-16:00
          - ✅ Receiving handover: IN202609260021, received 480/500 pcs, 20 pcs discrepancy registered for handling
          - ⏳ **In QC**: QC202609270005, 15% sampling, 62/75 pcs inspected, expected to finish in 25 minutes
          - ⬜ Putaway task: not generated (PA tasks will be auto-dispatched to Zone B ASRS locations after QC)

          Risk note: at the current pace the full chain is expected to complete before 17:40, within the appointment window. Shall I watch the QC node and remind you when it completes?
        s1: Remind me when QC completes
        s2: View the 20 pcs receiving discrepancy
        s3: Which locations will this batch be put away to
      exceptionScan:
        thought: "Command understood: global exception scan. Scope = stock warnings + operation timeouts + slow-moving, window = today, sorted by priority."
        toolSummary: "{count} exceptions matched, 2 of them critical"
        step1: Exception Detection
        step2: Classification
        step3: Priority Ranking
        body: |-
          Today's global exception scan completed, **{count} matched** in total. Critical items by priority:

          **🔴 P0 · WH002 Guangzhou South Warehouse stockout warning**
          - SKU00017 car charging module: 0 available, 300 in transit expected 09-29
          - Impact: 6 unfulfilled orders; suggestion: partially fulfill 4 and switch the other 2 to WH001

          **🔴 P0 · Picking task timeout**
          - PK202609270012 (wave WV202609270003): 42 minutes over, responsible picking area C-02
          - Suggestion: escalate to the team leader or fall back to the AGV forklift

          **🟡 P1 · {slowCount} slow-moving warnings**: 3 SKUs in Zone B with no movement for 90 days; promotion or transfer suggested

          Shall I create a handling ticket for any of these exceptions?
        s1: Handle the WH002 stockout warning
        s2: View slow-moving SKU details
        s3: Push P0 exceptions to the team group
      reportGen:
        thought: "Command understood: report interpretation. Aggregate this week's inbound/outbound and operation efficiency KPIs, compare week over week, and output highlights and suggestions."
        toolSummary: Aggregated 7 days × 3 metric groups from 126k transactions
        body: |-
          Operational highlights of this week (09-21 to 09-27):

          - **Throughput**: inbound 21,436 pcs (+8.2% WoW), outbound 28,701 pcs (+15.6% WoW), outbound peaks on Thursday
          - **Efficiency**: picking 142 pcs per person-hour (+6 WoW), 3,208 AGV transfer tasks, equipment utilization 81%
          - **Quality**: receiving discrepancy rate 0.42%, picking error rate 0.08%, both within target
          - **Warning**: WH002 outbound volume fell for two straight weeks (-12%) while inventory turnover days rose to 47

          Conclusion: healthy overall; attention to the WH002 inventory structure is suggested. Shall I generate the full weekly report PDF or dig into the cause of the WH002 turnover anomaly?
        s1: Dig into the WH002 turnover anomaly
        s2: Generate outbound trend chart data
        s3: Compare with last month's efficiency
      freightQuote:
        thought: "Command understood: international freight quote. Params: origin Shanghai (CNSHA) → Los Angeles (USLAX), 2 pallets / 500kg / 3.2cbm, ocean LCL vs express compared first."
        toolSummary: Returned 3 channel quotes (ocean LCL / ocean express / air)
        body: |-
          **Shanghai → Los Angeles** (2 pallets / 500kg / 3.2cbm) quote results:

          - **Ocean LCL**: about $680 ($212/cbm + surcharges), 28-34 days door to door, cutoff every Tue/Fri
          - **Ocean express (Matson limited-time)**: about $1,150, 18-22 days, suitable for urgent restock
          - **Air**: about $2,400 ($4.8/kg), 5-7 days, including 1-2 days of customs

          Suggestion: use LCL for non-urgent restock at the lowest unit logistics cost; for the 6 orders tied to the WH002 stockout, the express channel balances speed and cost.

          Note: quotes are preview simulation only; official quotes follow contract schedules and live fuel surcharges.
        s1: Estimate the total cost via the express channel
        s2: Compare full transit time to the WH001 US-West warehouse
        s3: Generate a quotation draft
      etaQuery:
        thought: "Command understood: in-transit ETA query. Retrieving the GPS track of delivery order DP202609250008, the carrier's promised time, and the current congestion index."
        toolSummary: Track matched 12 nodes; latest at the G15 Changshu section
        bodyOnTime: |-
          In-transit status of **DP202609250008** (carrier: Shunzhi Logistics · 沪A·D8821):

          - Current position: G15 Shenhai Expressway, Changshu section (track at 09-27 10:42)
          - Promised by 09-27 18:00, **estimated arrival 17:20**, on-time check: ✅ on schedule
          - 86 km remaining, passing 2 (light) congestion points

          Shall I enable an arrival reminder 30 minutes before delivery?
        bodyDelayed: |-
          In-transit status of **DP202609250008** (carrier: Shunzhi Logistics · 沪A·D8821):

          - Current position: G15 Shenhai Expressway, Changshu section (track at 09-27 10:42)
          - Promised by 09-27 18:00, **estimated arrival 19:10, about 70 minutes late** ⚠
          - Cause: accident control on the Suzhou section plus unloading queue (2 orders ahead)

          Suggestion: I can push a delay-soothing SMS to the consignee and adjust the dock appointment. Shall I proceed?
        s1: Push a delay notification to the customer
        s2: Adjust tonight's dock appointment
        s3: View this carrier's on-time rate this month
      customsCheck:
        thought: "Command understood: intelligent export document review. Executing workflow WF-AI-003: OCR parsing → element verification → HS pre-classification → risk flagging."
        toolSummaryOcr: Parsed 3 documents (invoice / packing list / POA) and extracted 18 elements
        toolSummaryHs: Pre-classified as 8482.10 (rolling bearings), confidence 0.94
        stepOcr: OCR Document Parsing
        stepVerify: Element Completeness Check
        stepHs: HS Code Pre-classification
        stepRisk: Risk Flagging and Review
        body: |-
          Document review completed (workflow WF-AI-003). Results:

          **✅ Element verification**: 16 of 18 passed
          - Invoice, packing list, and customs POA are complete
          - ⚠ Certificate of origin missing (required for general-trade tax refund; submission recommended)
          - ⚠ Gross weight differs between the packing list and the invoice (1,240kg vs 1,215kg); confirm manually with the customs declaration as authoritative

          **✅ HS pre-classification**: 8482.10 rolling bearings (94% confidence), rebate rate 13%, no special regulatory requirements

          **Risk level**: 🟡 Medium (2 items pending manual confirmation). A customs declaration draft can be generated right after confirmation. Continue?
        s1: Correct the gross weight per the customs declaration
        s2: Generate a customs declaration draft
        s3: View regulatory conditions of HS 8482.10
      exceptionHandle:
        thought: "Command understood: exception handling. Target = WH002 stockout warning ({sku}); executing the handling workflow: root cause analysis → plan matching → ticket creation."
        toolSummaryRoot: "Root cause: sales forecast 35% too low + 2-day supplier delay"
        toolSummaryTicket: Replenishment ticket RP202609270011 created
        stepConfirm: Exception Confirmation
        stepRoot: Root Cause Analysis
        stepPlan: Plan Matching
        stepTicket: Ticket Creation
        body: |-
          Handling completed. Execution summary:

          **Root cause**: sales forecast was 35% below actual during the promo warm-up, compounded by a 2-day supplier material delay

          **Actions taken**:
          - ✅ Urgent replenishment ticket **RP202609270011** created (300 pcs, expedited), ETA 09-29 10:00
          - ✅ Of the 6 affected orders, 4 partially fulfilled and 2 switched to WH001 Shanghai Main Warehouse (cross-warehouse dispatch)
          - ✅ Owner B Precision Machinery's customer service notified to sync customer delivery dates

          **Follow-up suggestions** (manual confirmation needed): raise the SKU's safety stock from 500 to 650 and include it in the promo forecast correction model.

          Tickets and notifications are logged in Runs and traceable at any time.
        s1: View RP202609270011 ticket details
        s2: Raise the safety stock to 650
        s3: Review this month's similar warnings
      general:
        thought: No deterministic skill matched; switching to general Q&A mode (the preview engine only simulates answers within the warehousing and international logistics domains).
        body: |-
          Command received: "{question}".

          This is the local preview engine. Supported skill domains:
          - Warehousing: Check Stock / Track Documents / Find Issues / Generate Reports
          - International logistics: Freight Quote / ETA Query / Customs Compliance / Exception Handling

          Try rephrasing (e.g. "Check WH001 stock") or wait until the remote Agent gateway is connected to unlock full natural language capability.
        s1: Check WH001 Shanghai Main Warehouse stock
        s2: Scan today's exceptions
        s3: Quote freight from Shanghai to Los Angeles
