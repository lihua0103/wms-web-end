        body: |-
          已为您查询 **WH001 上海主仓** 实时库存，重点结果如下：

          **1. SKU00003 精密轴承（A 类）**
          - 可用库存：1,284 件｜库位 B-03-01 ～ B-03-06
          - 批次效期：B2609A（2027-03-15 到期）｜安全库存达成率 96%
          - 状态：正常

          **2. SKU00011 锂电池模组（危险品）**
          - 可用库存：460 件｜库位 D-02-03（隔离区，UN3480）
          - ⚠ 低于安全库存线（500 件），建议触发补货评估

          **3. SKU00027 精工机械配件**
          - 可用库存：2,150 件｜库位 B-05-02
          - ⚠ 滞销预警：连续 90 天无出库记录

          汇总：A 区库位占用率 82%，B 区 67%。需要我导出明细、查看某批次序列号，或直接生成补货建议吗？
        s1: 生成 SKU00011 补货建议
        s2: 查 B 区库位占用明细
        s3: 导出库存快照
