          - **空运**：约 $2,400（$4.8/kg），全程 5-7 天，含清关 1-2 天

          建议：非紧急补货走 LCL，单件物流成本最低；若对接 WH002 缺货的 6 笔订单，推荐快船渠道平衡时效与成本。

