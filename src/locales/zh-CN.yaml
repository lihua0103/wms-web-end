        thought: 已理解指令：单据全链路追踪。识别单号 ASN202609260013（入库预约），沿「预约 → 收货 → 质检 → 上架」链路检索执行进度。
        toolSummary: 链路命中 4 个节点，当前停留在「质检」
        body: |-
          单据 **ASN202609260013**（入库预约 · 货主A 华东电子）执行进度：

          - ✅ 预约确认：09-26 09:12，月台 D-03，预约时段 14:00-16:00
          - ✅ 收货交接：IN202609260021，实收 480/500 件，差异 20 件已登记待处理
